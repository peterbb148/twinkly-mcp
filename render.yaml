services:
  - type: web
    name: twinkly-mcp
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --locked --no-sync uvicorn twinkly_mcp.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.17"
      - key: UV_VERSION
        value: "0.13.1"
      - key: TWINKLY_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
