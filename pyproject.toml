[project]
name = "twinkly-mcp"
version = "0.1.0"
description = "MCP server for remote Twinkly LED wall control"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastmcp>=4.1.3,<5",
    "starlette>=1.9,<2",
    "uvicorn>=0.54,<1",
    "pydantic>=2.14.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28.1,<1",
    "ruff>=0.17.1,<1",
    "pytest-cov>=7,<8",
    "pip-audit>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinkly_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
